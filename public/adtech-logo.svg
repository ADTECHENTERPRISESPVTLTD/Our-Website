<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="metalLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M55 220 L130 70 L155 70 L155 220 L135 220 L135 165 L100 165 L100 220 Z" fill="url(#metalDark)" transform="translate(10,10)"/>
    <path d="M55 220 L130 70 L155 70 L155 220 L135 220 L135 165 L100 165 L100 220 Z" fill="url(#metal)"/>
    <path d="M55 220 L130 70 L155 70 L155 220 L135 220 L135 165 L100 165 L100 220 Z" fill="url(#metalLight)" opacity="0.4"/>
    
    <!-- A inner cut/highlight -->
    <path d="M90 145 L125 145 L110 105 L95 105 Z" fill="url(#metalLight)" opacity="0.9"/>
    <path d="M90 145 L125 145 L110 105 L95 105 Z" fill="#0f172a" opacity="0.15"/>

    <!-- Letter D -->
    <path d="M170 70 L280 70 C325 70 350 100 350 145 C350 190 325 220 280 220 L170 220 L170 200 L280 200 C310 200 330 180 330 145 C330 110 310 90 280 90 L170 90 Z" fill="url(#metalDark)" transform="translate(10,10)"/>
    <path d="M170 70 L280 70 C325 70 350 100 350 145 C350 190 325 220 280 220 L170 220 L170 200 L280 200 C310 200 330 180 330 145 C330 110 310 90 280 90 L170 90 Z" fill="url(#metal)"/>
    <path d="M170 70 L170 90 L280 90 C310 90 330 110 330 145 C330 180 310 200 280 200 L170 200 Z" fill="url(#metalLight)" opacity="0.5"/>
    
    <!-- D inner hole -->
    <circle cx="260" cy="145" r="45" fill="#0f172a" opacity="0.2"/>
    <circle cx="260" cy="145" r="42" fill="url(#metalDark)" opacity="0.3"/>
  </g>
</svg>
